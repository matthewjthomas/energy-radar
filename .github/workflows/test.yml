name: Tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".env.example"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".env.example"

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    # API and DB integration tests require TimescaleDB; pure analytics tests run too.
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: energyradar
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: energyradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energyradar -d energyradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://energyradar:changeme@localhost:5432/energyradar
      APP_TIMEZONE: UTC
      HA_URL: ""
      HA_TOKEN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=term-missing

  docker-smoke:
    runs-on: ubuntu-latest
    needs: unit-and-integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t energy-radar:test .

      - name: Start TimescaleDB
        run: |
          docker network create energy-radar-test || true
          docker run -d --name energy-radar-db --network energy-radar-test \
            -e POSTGRES_USER=energyradar \
            -e POSTGRES_PASSWORD=changeme \
            -e POSTGRES_DB=energyradar \
            timescale/timescaledb:latest-pg16
          for i in $(seq 1 30); do
            docker exec energy-radar-db pg_isready -U energyradar -d energyradar && break
            sleep 2
          done

      - name: Start application container
        run: |
          docker run -d --name energy-radar-app --network energy-radar-test \
            -p 8000:8000 \
            -e DATABASE_URL=postgresql+asyncpg://energyradar:changeme@energy-radar-db:5432/energyradar \
            -e APP_TIMEZONE=UTC \
            energy-radar:test
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Tear down containers
        if: always()
        run: |
          docker rm -f energy-radar-app energy-radar-db || true
          docker network rm energy-radar-test || true
